<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#search">Skip to main content</a>
    <nav class="navbar" aria-label="Primary">
        <div class="nav-inner">
            <a class="logo" href="/">Internship Tracker</a>
            <div class="nav-links">
                <a href="#search" aria-current="page">Search</a>
                <a href="#results">Results</a>
                <div class="profile-wrapper" id="profile-wrapper">
                    <button type="button" class="profile-button" id="profile-button" aria-expanded="false" aria-label="Open profile menu" aria-controls="dropdown-panel">
                        <img src="pfp.jpg" alt="" class="profile-picture">
                    </button>
                    <div class="dropdown-panel" id="dropdown-panel" hidden>
                        <a href="saved_internships.html">Saved Internships</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main id="search" tabindex="-1">
        <p id="app-status" class="app-status" role="alert" hidden></p>

        <form id="search-form" class="search-form">
            <div class="form-field">
                <label for="keyword">Role or keyword</label>
                <input id="keyword" placeholder="Software engineering intern">
            </div>

            <div class="form-field country-field">
                <label for="country">Country</label>
                <select id="country">
                    <option value="at">Austria</option>
                    <option value="au">Australia</option>
                    <option value="br">Brazil</option>
                    <option value="ca">Canada</option>
                    <option value="fr">France</option>
                    <option value="de">Germany</option>
                    <option value="in">India</option>
                    <option value="it">Italy</option>
                    <option value="nl">Netherlands</option>
                    <option value="nz">New Zealand</option>
                    <option value="pl">Poland</option>
                    <option value="sg">Singapore</option>
                    <option value="es">Spain</option>
                    <option value="gb" selected>United Kingdom</option>
                    <option value="us">United States</option>
                </select>
            </div>

            <div class="form-field">
                <label for="location">Location</label>
                <input id="location" placeholder="Anywhere">
            </div>

            <button id="search-button" type="submit">Search</button>
        </form>
        <h1 class="results-header" id="results-header" tabindex="-1">All Internships</h1>
        <section id="results" aria-labelledby="results-header" aria-live="polite"></section>

        <template id="job-template">
            <article class="job-card">
                <header class="job-card-header">
                    <h2 class="job-title"></h2>
                    <button type="button" class="save-button" aria-label="Save internship" aria-pressed="false">
                        <svg class="save-icon save-icon-plus" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14"></path>
                            <path d="M12 5v14"></path>
                        </svg>
                        <svg class="save-icon save-icon-check" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 6 9 17l-5-5"></path>
                        </svg>
                    </button>
                </header>
                <p class="job-meta">
                    <span class="job-company"></span>
                    <span class="job-location"></span>
                </p>
                <p class="job-description"></p>
                <footer class="job-card-footer">
                    <a class="job-link" target="_blank" rel="noopener noreferrer">
                        View details
                    </a>
                </footer>
            </article>
        </template>

        <nav
            id="pagination"
            class="pagination"
            aria-label="Search result pages"
            hidden
        ></nav>
    </main>
</body>
</html>
