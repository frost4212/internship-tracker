<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Internships</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#saved-search">Skip to main content</a>
    <nav class="navbar" aria-label="Primary">
        <div class="nav-inner">
            <a class="logo" href="/">Internship Tracker</a>
            <div class="nav-links">
                <a id="saved-nav-search" href="#saved-search" aria-current="location">Search</a>
                <a id="saved-nav-results" href="#saved-results">Results</a>
                <div class="profile-wrapper" id="profile-wrapper">
                    <button type="button" class="profile-button" id="profile-button" aria-expanded="false" aria-label="Open profile menu" aria-controls="dropdown-panel">
                        <img src="pfp.jpg" alt="" class="profile-picture">
                    </button>
                    <div class="dropdown-panel" id="dropdown-panel" hidden>
                        <a href="saved_internships.html" aria-current="page">Saved Internships</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="saved-search" tabindex="-1">
        <div class="saved-page-header">
            <h1 class="page-title" id="saved-internships-header">Saved Internships</h1>
            <div class="saved-page-actions">
                <button
                    class="manual-entry-button"
                    id="manual-entry-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="manual-application-form"
                >
                    <span class="manual-entry-button-icon" aria-hidden="true"></span>
                    Add application
                </button>
                <button
                    type="button"
                    class="clear-btn"
                    id="clear-btn"
                    aria-controls="confirm-menu"
                >
                    <svg class="clear-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"></path>
                    </svg>
                    Clear all
                </button>
            </div>
        </div>

        <form class="manual-application-form" id="manual-application-form" hidden>
            <div class="form-field">
                <label for="manual-title">Job title</label>
                <input id="manual-title" name="title" placeholder="Software Engineering Intern" required>
            </div>

            <div class="form-field">
                <label for="manual-company">Company</label>
                <input id="manual-company" name="company" placeholder="Company name" required>
            </div>

            <div class="form-field">
                <label for="manual-location">Location</label>
                <input id="manual-location" name="location" placeholder="City or remote">
            </div>

            <div class="form-field">
                <label for="manual-status">Status</label>
                <select id="manual-status" name="status" required>
                </select>
            </div>

            <div class="form-field">
                <label for="manual-url">Posting URL</label>
                <input id="manual-url" name="url" placeholder="https://example.com/job" type="url">
            </div>

            <div class="form-field">
                <label for="manual-application-date">Application date</label>
                <input id="manual-application-date" name="applicationDate" type="date">
            </div>

            <div class="form-field manual-field-wide">
                <label for="manual-description">Role description</label>
                <textarea id="manual-description" name="description" rows="4"></textarea>
            </div>

            <div class="form-field manual-field-wide">
                <label for="manual-notes">Notes</label>
                <textarea id="manual-notes" name="notes" rows="4"></textarea>
            </div>

            <div class="manual-form-actions">
                <button class="manual-submit-button" type="submit">Save application</button>
            </div>
        </form>

        <form id="saved-search-form" class="search-form">
            <div class="form-field">
                <label for="saved-keyword">Role or keyword</label>
                <input id="saved-keyword" placeholder="Title or company">
            </div>

            <div class="form-field">
                <label for="saved-location">Location</label>
                <input id="saved-location" placeholder="Anywhere">
            </div>

            <button id="saved-search-button" type="submit">Search saved</button>
        </form>

        <dialog
            class="confirm-dialog"
            id="confirm-menu"
            role="alertdialog"
            aria-modal="true"
            aria-labelledby="confirm-menu-title"
            aria-describedby="confirm-menu-description"
        >
            <div class="confirm-dialog-content">
                <h2 id="confirm-menu-title">Clear saved internships?</h2>
                <p id="confirm-menu-description">This will permanently remove every saved internship from this browser.</p>
                <div class="confirm-dialog-actions">
                    <button class="confirm-cancel-btn" id="clear-cancel-btn" type="button" autofocus>Cancel</button>
                    <button class="confirm-clear-btn" id="confirm-clear-btn" type="button">Clear all</button>
                </div>
            </div>
        </dialog>

        <p id="app-status" class="app-status" role="alert" hidden></p>
        <section id="saved-results" class="saved-internships" tabindex="-1" aria-labelledby="saved-internships-header" aria-live="polite"></section>
        <nav
            id="saved-pagination"
            class="pagination"
            aria-label="Saved internship pages"
            hidden
        ></nav>

        <template id="job-template">
                <article class="job-card">
                    <header class="job-card-header">
                        <h2 class="job-title"></h2>
                        <button type="button" class="save-button" aria-label="Save internship" aria-pressed="false">
                            <svg class="save-icon save-icon-plus" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12h14"></path>
                                <path d="M12 5v14"></path>
                            </svg>
                            <svg class="save-icon save-icon-check" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M20 6 9 17l-5-5"></path>
                            </svg>
                        </button>
                    </header>
                    <p class="job-meta">
                        <span class="job-company"></span>
                        <span class="job-location"></span>
                    </p>
                    <p class="job-description"></p>
                    <footer class="job-card-footer">
                        <a class="job-link" target="_blank" rel="noopener noreferrer">
                            View details
                        </a>
                    </footer>
                </article>
        </template>
    </main>
</body>
</html>
